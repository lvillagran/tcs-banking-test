spring.application.name=tcs-banking-notificaciones
spring.main.web-application-type=none

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | [%thread] | %logger{40} | %msg%n
logging.level.root=INFO
logging.level.com.banking.notificaciones=INFO
# El consumidor seguirá reintentando, pero sin inundar la consola si Kafka está apagado.
logging.level.org.apache.kafka=ERROR

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=tcs-banking-notificaciones
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=cuentaCreada:com.banking.notificaciones.event.CuentaCreadaEvent,movimientoRealizado:com.banking.notificaciones.event.MovimientoRealizadoEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.banking.notificaciones.event
spring.kafka.listener.ack-mode=record
