spring.application.name=tcs-banking-operaciones

# Formato profesional de logs en consola:
# fecha ISO-8601 | nivel | aplicación | hilo | logger | mensaje
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | [%thread] | %logger{40} | %msg%n
logging.level.root=INFO
logging.level.com.banking.operaciones=INFO
# Evita saturar la consola con reintentos internos cuando Kafka está apagado.
logging.level.org.apache.kafka=ERROR

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tcs_bank}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
server.port=9091
banking.backoffice.base-url=${BACKOFFICE_BASE_URL:http://localhost:9098}

# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=cuentaCreada:com.banking.operaciones.event.CuentaCreadaEvent,movimientoRealizado:com.banking.operaciones.event.MovimientoRealizadoEvent
